<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Voter App - Page Not Found</title>
  <script type="text/javascript">
    const appBasePath = '/VotersWebApp';
    const path = window.location.pathname;
    const clientRoute = path.startsWith(appBasePath + '/') 
        ? path.substring(appBasePath.length) 
        : path;
        
    const redirectUrl = appBasePath + '/?path=' + encodeURIComponent(clientRoute) + window.location.search + window.location.hash;
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
    <p>If you are not redirected automatically, please <a href="/VotersWebApp/">click here to return to the homepage</a>.</p>
</body>
</html>
